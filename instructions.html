<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How to Play · word pop</title>
  <style>
    /* playful comic style: warm cream, bold outlines, glossy bubbles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #fbead5;  /* warm light cream */
      font-family: 'Fredoka', 'Comic Neue', 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.2rem;
    }

    /* modal card – thick dark border, comic vibe */
    .modal {
      max-width: 600px;
      width: 100%;
      background: #fff6e6;   /* soft cream */
      border: 6px solid #102a3c;   /* dark blue outline */
      border-radius: 70px 70px 60px 60px;
      box-shadow: 0 18px 0 #0a1e2c, 0 25px 30px -8px #301a0a40;
      padding: 2.8rem 2.2rem 3rem 2.2rem;
    }

    /* title – large, chunky, rounded serif (fredoka works as friendly rounded) */
    .title {
      font-size: 4.2rem;
      font-weight: 800;
      color: #ff871b;        /* bold orange */
      text-transform: uppercase;
      text-shadow: 5px 5px 0 #102a3c, 7px 7px 0 #00000030;
      letter-spacing: -1px;
      line-height: 1;
      margin-bottom: 2rem;
      text-align: center;
      transform: rotate(-0.5deg);
      font-family: 'Fredoka', 'Comic Neue', cursive;
      word-break: break-word;
    }

    /* instruction rows – sky blue pills with thick border */
    .instruction-list {
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
      margin: 2rem 0 2.5rem;
    }

    .instruction-row {
      background: #9fc9ff;    /* sky blue */
      border: 5px solid #102a3c;   /* thick dark blue */
      border-radius: 60px;
      padding: 1rem 1.5rem 1rem 1.2rem;
      display: flex;
      align-items: center;
      gap: 1.2rem;
      box-shadow: 0 9px 0 #51718c, 0 10px 0 #102a3c;
      transition: 0.06s linear;
    }

    /* subtle press effect */
    .instruction-row:active {
      transform: translateY(5px);
      box-shadow: 0 4px 0 #51718c, 0 5px 0 #102a3c;
    }

    /* circular icons – exactly as requested */
    .icon-circle {
      width: 48px;
      height: 48px;
      border-radius: 100px;
      border: 4px solid #102a3c;
      flex-shrink: 0;
      box-shadow: 0 5px 0 #3a4f64, 0 6px 0 #102a3c;
    }

    /* icon colors */
    .icon-correct { background: #addf91; }  /* bright lime‑green */
    .icon-misplaced { background: #ffe074; } /* sunny yellow */
    .icon-absent { background: #9aaebf; }    /* muted blue‑gray */
    .icon-enter, .icon-backspace {
      background: #9fc9ff;   /* same sky blue, but we put symbols */
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 800;
      color: #102a3c;
      line-height: 1;
    }

    .instruction-text {
      font-size: 1.8rem;
      font-weight: 700;
      color: #102a3c;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-shadow: 2px 2px 0 #d2e5ff;
      flex: 1;
    }

    /* start button – glossy orange bubble */
    .start-button {
      background: #ff9f4b;    /* vibrant orange */
      border: 5px solid #102a3c;
      border-radius: 100px;
      padding: 1.5rem 2rem;
      width: 100%;
      font-size: 3rem;
      font-weight: 800;
      color: white;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 3px 3px 0 #b45f1a;
      box-shadow: 0 16px 0 #b45f1a, 0 18px 0 #102a3c, 0 20px 20px -8px #402e1c;
      cursor: pointer;
      transition: 0.08s linear;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      border-bottom-width: 5px;
      margin-top: 2rem;
      line-height: 1;
    }

    .start-button:active {
      transform: translateY(12px);
      box-shadow: 0 6px 0 #b45f1a, 0 8px 0 #102a3c, 0 12px 18px -6px #402e1c;
    }

    /* arrow decorations */
    .start-arrow {
      font-size: 3.5rem;
      line-height: 1;
      filter: drop-shadow(2px 4px 0 #102a3c);
    }

    /* responsive adjustments */
    @media (max-width: 520px) {
      .modal { padding: 1.8rem 1.2rem; border-radius: 50px; }
      .title { font-size: 3rem; }
      .instruction-row { padding: 0.7rem 1rem; gap: 0.8rem; }
      .icon-circle { width: 38px; height: 38px; }
      .instruction-text { font-size: 1.3rem; }
      .start-button { font-size: 2.2rem; padding: 1rem; }
      .start-arrow { font-size: 2.4rem; }
    }

    @media (max-width: 380px) {
      .title { font-size: 2.4rem; }
      .instruction-text { font-size: 1rem; }
      .icon-circle { width: 32px; height: 32px; }
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="modal">
    <!-- chunky orange title with dark blue outline -->
    <div class="title">how to play</div>

    <!-- instruction rows: sky blue pills with circular icons -->
    <div class="instruction-list">
      <!-- correct row -->
      <div class="instruction-row">
        <div class="icon-circle icon-correct"></div>
        <span class="instruction-text">correct letter, right spot</span>
      </div>
      <!-- misplaced row -->
      <div class="instruction-row">
        <div class="icon-circle icon-misplaced"></div>
        <span class="instruction-text">correct letter, wrong spot</span>
      </div>
      <!-- absent row -->
      <div class="instruction-row">
        <div class="icon-circle icon-absent"></div>
        <span class="instruction-text">letter not in word</span>
      </div>
      <!-- enter row (using same sky blue but with symbol) -->
      <div class="instruction-row">
        <div class="icon-circle icon-enter">↵</div>
        <span class="instruction-text">submit guess</span>
      </div>
      <!-- backspace row -->
      <div class="instruction-row">
        <div class="icon-circle icon-backspace">⌫</div>
        <span class="instruction-text">delete letter</span>
      </div>
    </div>

    <!-- glossy orange start button -->
    <button class="start-button" id="startGameBtn">
      <span class="start-arrow">▶</span> start game <span class="start-arrow">◀</span>
    </button>
  </div>

  <script>
    (function() {
      // Function to get URL parameter
      function getURLParameter(name) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(name);
      }

      // Get difficulty from URL
      const difficulty = getURLParameter('difficulty');
      if (difficulty) {
        localStorage.setItem('difficulty', difficulty);
      }

      // when start is clicked, go to game
      document.getElementById('startGameBtn').addEventListener('click', () => {
        window.location.href = `game.html?difficulty=${difficulty || 'medium'}`;
      });

      // optional: difficulty integration if needed (this modal is self-contained)
      // if you want to read difficulty from localStorage and maybe show it, you could add
      // but the spec asked only for the modal with those 5 rows + start button.
    })();
  </script>
</body>
</html>
